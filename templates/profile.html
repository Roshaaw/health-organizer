<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="top-banner">
        <div class="top-banner-content">
            <div>
                <h1>User Profile</h1>
                <p>View and update your personal health details.</p>
            </div>

            <nav class="top-nav">
                {% if user %}
                    <a href="/">Dashboard</a>
                    <a href="/profile">Profile</a>
                    <a href="/logout">Logout</a>
                {% else %}
                    <a href="/login">Login</a>
                    <a href="/signup">Sign Up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card profile-card">
            <div class="section-header">
                <div>
                    <h2>Your Health Profile</h2>
                    <p class="section-description">
                        Update your personal and medical details below.
                    </p>
                </div>
            </div>

            {% if success %}
                <p class="success-message">Profile updated successfully!</p>
            {% endif %}

            <form class="profile-form" method="POST" action="/profile/update">
                <div class="profile-form-grid">
                    <label>
                        First Name
                        <input type="text" name="first_name" value="{{ user.first_name }}" required>
                    </label>

                    <label>
                        Last Name
                        <input type="text" name="last_name" value="{{ user.last_name }}" required>
                    </label>

                    <label>
                        Email
                        <input type="email" name="email" value="{{ user.email }}" required>
                    </label>

                    <label>
                        Phone
                        <input type="tel" name="phone" value="{{ user.phone }}" placeholder="123-456-7890">
                    </label>

                    <label>
                        Birthday
                        <input type="date" name="birthday" value="{{ user.birthday }}">
                    </label>

                    <label>
                        Height
                        <input type="text" name="height" value="{{ user.height }}" placeholder="5'10&quot;">
                    </label>

                    <label>
                        Weight
                        <input type="text" name="weight" value="{{ user.weight }}" placeholder="160 lbs">
                    </label>

                    <label>
                        Blood Type
                        <input type="text" name="blood_type" value="{{ user.blood_type }}" placeholder="O+">
                    </label>

                    <label class="full-width">
                        Allergies
                        <input type="text" name="allergies" value="{{ user.allergies }}" placeholder="None listed">
                    </label>

                    <label>
                        Primary Doctor
                        <input type="text" name="primary_doctor" value="{{ user.primary_doctor }}">
                    </label>

                    <label>
                        Emergency Contact
                        <input type="text" name="emergency_contact" value="{{ user.emergency_contact }}">
                    </label>
                </div>

                <button class="profile-save-btn" type="submit">Save Profile</button>
            </form>
        </section>
    </main>
</body>
</html>
