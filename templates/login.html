<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Login</h1>
        <p>Access your health organizer account.</p>

        <form class="form-grid" method="POST" action="/login">
          <input type="email" name="email" placeholder="Email" required />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />

          <button type="submit">Login</button>
        </form>

        <p class="auth-link">
          Don't have an account? <a href="/signup">Sign up</a>
        </p>
        <p class="auth-link"><a href="/">Back to Dashboard</a></p>
      </div>
    </div>
  </body>
</html>
